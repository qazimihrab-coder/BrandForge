<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrandForge</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Vazirmatn,sans-serif;
  background:#05070d;
  color:#fff;
  min-height:100vh
}

button{
  font:inherit;
  border:0;
  cursor:pointer
}

.app{
  min-height:100vh;
  overflow:hidden;
  background:
  radial-gradient(circle at 15% 10%,rgba(0,229,255,.12),transparent 30%),
  radial-gradient(circle at 85% 85%,rgba(124,58,237,.15),transparent 32%),
  #05070d
}

.nav{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(5,7,13,.7)
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px
}

.logo span{
  color:#00e5ff
}

.badge{
  font-size:11px;
  color:#9ca3af;
  border:1px solid #202938;
  padding:6px 10px;
  border-radius:999px
}

.page{
  display:none;
  max-width:1100px;
  margin:auto;
  padding:55px 20px 70px;
  animation:fade .35s ease
}

.page.active{
  display:block
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(12px)
  }
  to{
    opacity:1;
    transform:none
  }
}

.hero{
  text-align:center;
  padding:35px 0 45px
}

.eyebrow{
  display:inline-block;
  color:#00e5ff;
  font-size:13px;
  font-weight:700;
  margin-bottom:15px
}

.hero h1{
  font-size:clamp(36px,8vw,70px);
  line-height:1.05;
  font-weight:900;
  letter-spacing:-3px
}

.hero h1 span{
  background:linear-gradient(90deg,#00e5ff,#8b5cf6);
  -webkit-background-clip:text;
  color:transparent
}

.hero p{
  color:#9ca3af;
  max-width:600px;
  margin:18px auto 0;
  line-height:2;
  font-size:15px
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px
}

.choice{
  position:relative;
  text-align:right;
  padding:30px;
  border:1px solid #202938;
  border-radius:25px;
  background:linear-gradient(
    145deg,
    rgba(17,24,39,.9),
    rgba(8,11,20,.9)
  );
  transition:.25s;
  overflow:hidden
}

.choice:before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  background:var(--glow);
  filter:blur(45px);
  opacity:.18;
  top:-50px;
  left:-40px
}

.choice:hover{
  transform:translateY(-5px);
  border-color:#3b82f6
}

.icon{
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  border-radius:18px;
  font-size:29px;
  background:#111827;
  margin-bottom:22px
}

.choice h2{
  font-size:24px;
  margin-bottom:9px
}

.choice p{
  color:#8f9aaa;
  font-size:14px;
  line-height:1.9
}

.arrow{
  margin-top:24px;
  color:#00e5ff;
  font-weight:800
}

.title{
  text-align:center;
  margin-bottom:35px
}

.title h2{
  font-size:32px
}

.title p{
  color:#8f9aaa;
  margin-top:10px
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.option{
  background:#0c111c;
  border:1px solid #202938;
  border-radius:18px;
  padding:22px 15px;
  text-align:center;
  color:#fff;
  transition:.2s
}

.option:hover{
  border-color:#00e5ff;
  transform:translateY(-3px);
  background:#101827
}

.option .big{
  font-size:28px;
  margin-bottom:10px
}

.option strong{
  display:block;
  font-size:14px
}

.option small{
  color:#788396;
  display:block;
  margin-top:5px
}

.back{
  background:transparent;
  color:#8f9aaa;
  padding:8px 0;
  margin-bottom:25px
}

.back:hover{
  color:#fff
}

.result{
  max-width:650px;
  margin:auto;
  text-align:center
}

.input{
  width:100%;
  padding:16px 18px;
  border-radius:15px;
  border:1px solid #263143;
  background:#0b101a;
  color:#fff;
  outline:none;
  margin:8px 0 18px;
  font:inherit
}

.input:focus{
  border-color:#00e5ff
}

.primary{
  width:100%;
  padding:16px;
  border-radius:15px;
  background:linear-gradient(90deg,#00bcd4,#7c3aed);
  color:#fff;
  font-weight:800
}

.result-box{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:25px
}

.name{
  padding:20px;
  background:#0b101a;
  border:1px solid #202938;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:16px
}

.copy{
  padding:7px 10px;
  border-radius:9px;
  background:#172033;
  color:#00e5ff;
  font-size:12px
}

@media(max-width:650px){

  .nav{
    height:64px
  }

  .page{
    padding:35px 15px
  }

  .cards{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .hero{
    padding:20px 0 30px
  }

  .hero h1{
    letter-spacing:-2px
  }

  .result-box{
    grid-template-columns:1fr
  }

  .badge{
    display:none
  }
}
</style>
</head>

<script>

/* =========================================================
   BASIC NAVIGATION
========================================================= */

let mode = '';
let type = '';

function show(id){

  document
    .querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

  document
    .getElementById(id)
    .classList.add('active');

  window.scrollTo(0,0);
}


/* =========================================================
   NICKNAME
========================================================= */

function startNick(t){

  mode = 'nick';
  type = t;

  document
    .getElementById('builderTitle')
    .textContent = 'ساخت نیک‌نیم';

  document
    .getElementById('builderDesc')
    .textContent = 'سبک انتخاب‌شده: ' + t;

  document
    .getElementById('keyword')
    .placeholder = 'مثلاً: MihRab';

  document
    .getElementById('results')
    .innerHTML = '';

  show('builder');
}


/* =========================================================
   LOGO
========================================================= */

function startLogo(t){

  mode = 'logo';
  type = t;

  document
    .getElementById('builderTitle')
    .textContent = 'ساخت ایده لوگو';

  document
    .getElementById('builderDesc')
    .textContent = 'کاربرد انتخاب‌شده: ' + t;

  document
    .getElementById('keyword')
    .placeholder = 'نام برند یا پروژه را بنویس...';

  document
    .getElementById('results')
    .innerHTML = '';

  show('builder');
}


/* =========================================================
   UNICODE ENGLISH FONT ENGINE
========================================================= */

function mapUnicode(
  text,
  upperStart,
  lowerStart,
  digitStart = null
){

  return [...text].map(ch => {

    const code = ch.codePointAt(0);

    if(
      code >= 65 &&
      code <= 90 &&
      upperStart !== null
    ){

      return String.fromCodePoint(
        upperStart + (code - 65)
      );

    }

    if(
      code >= 97 &&
      code <= 122 &&
      lowerStart !== null
    ){

      return String.fromCodePoint(
        lowerStart + (code - 97)
      );

    }

    if(
      digitStart !== null &&
      code >= 48 &&
      code <= 57
    ){

      return String.fromCodePoint(
        digitStart + (code - 48)
      );

    }

    return ch;

  }).join('');

}


const englishUnicodeStyles = [

  {
    name:'Bold',
    transform:t =>
      mapUnicode(
        t,
        0x1D400,
        0x1D41A,
        0x1D7CE
      )
  },

  {
    name:'Bold Sans',
    transform:t =>
      mapUnicode(
        t,
        0x1D5A0,
        0x1D5BA,
        0x1D7EC
      )
  },

  {
    name:'Sans Italic',
    transform:t =>

        t,
        0x1D608,
        0x1D622
      )
  },

  {
    name:'Sans Bold Italic',
    transform:t =>
      mapUnicode(
        t,
        0x1D63C,
        0x1D656
      )
  },

  {
    name:'Monospace',
    transform:t =>
      mapUnicode(
        t,
        0x1D670,
        0x1D68A,
        0x1D7F6
      )
  },

  {
    name:'Double',
    transform:t =>
      mapUnicode(
        t,
        0x1D538,
        0x1D552
      )
  },

  {
    name:'Fraktur',
    transform:t =>
      mapUnicode(
        t,
        0x1D504,
        0x1D51E
      )
  },

  {
    name:'Bold Fraktur',
    transform:t =>
      mapUnicode(
        t,
        0x1D56C,
        0x1D586
      )
  },

  {
    name:'Script',
    transform:t =>
      mapUnicode(
        t,
        0x1D49C,
        0x1D4B6
      )
  },

  {
    name:'Bold Script',
    transform:t =>
      mapUnicode(
        t,
        0x1D4D0,
        0x1D4EA
      )
  },

  {
    name:'Fullwidth',
    transform:t =>
      [...t].map(ch => {

        const c = ch.charCodeAt(0);

        if(c >= 33 && c <= 126){
          return String.fromCharCode(c + 0xFEE0);
        }

        if(c === 32){
          return '　';
        }

        return ch;

      }).join('')
  },

  {
    name:'Small Caps',
    transform:t =>
      [...t].map(ch => {

        const m = {

          a:'ᴀ',
          b:'ʙ',
          c:'ᴄ',
          d:'ᴅ',
          e:'ᴇ',
          f:'ꜰ',
          g:'ɢ',
          h:'ʜ',
          i:'ɪ',
          j:'ᴊ',
          k:'ᴋ',
          l:'ʟ',
          m:'ᴍ',
          n:'ɴ',
          o:'ᴏ',
          p:'ᴘ',
          q:'ǫ',
          r:'ʀ',
          s:'s',
          t:'ᴛ',
          u:'ᴜ',
          v:'ᴠ',
          w:'ᴡ',
          x:'x',
          y:'ʏ',
          z:'ᴢ'

        };

        return m[ch.toLowerCase()] || ch;

      }).join('')
  }

];

const englishStyledList = [];


englishUnicodeStyles.forEach(style => {

  englishStyledList.push({
    name:style.name,
    transform:style.transform
  });

});


englishDecorations.forEach((item,index) => {

  englishStyledList.push({

    name:'Style ' + (index + 1),

    transform:text =>
      item[0] + text + item[1]

  });

});


/* =========================================================
   PERSIAN UNICODE STYLES
   متن اصلی «محراب» حفظ می‌شود
========================================================= */

const persianDecorations = [

  ['꧁༺ ',' ༻꧂'],

/* =========================================================
   FONT STUDIO — OPTIONAL ACCESS
========================================================= */

let currentFontType = 'persian';


function renderFontStudio(text){

  const styles =
    currentFontType === 'persian'
    ? persianUnicodeStyles
    : englishStyledList;

  return styles.map(style => {

    return {
      name:style.name,
      value:style.transform(text)
    };

  });

}


/* =========================================================
   UNIVERSAL COPY
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    return true;

  }catch(e){

    const textarea =
      document.createElement('textarea');

    textarea.value = text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand('copy');

    textarea.remove();

    return true;

  }

}


/* =========================================================
   NICKNAME GENERATOR
========================================================= */

function generate(){

  let keyword =
    document
      .getElementById('keyword')
      .value
      .trim();

  if(!keyword){
    keyword =
      mode === 'nick'
      ? 'MihRab'
      : 'Brand';
  }


  let out = [];


  if(mode === 'nick'){

    if(type === 'Dark'){

      out = [

        '乂' + keyword + '乂',
        '『' + keyword + '』',
        '☠' + keyword + '☠',
        'メ' + keyword + 'メ',
        '꧁☠' + keyword + '☠꧂',
        '亗' + keyword + '亗',
        '༺' + keyword + '༻',
        '𓆩' + keyword + '𓆪'

      ];

    }

    else if(type === 'Gaming'){

      out = [

        '亗' + keyword + '亗',
        '乂' + keyword + '乂',
        'メ' + keyword + 'メ',
        'ツ' + keyword + 'ツ',
        '『' + keyword + '』',
        '꧁' + keyword + '꧂',
        '⚔' + keyword + '⚔',
        '♛' + keyword + '♛'

      ];

    }

    else{

      out = [

        '『' + keyword + '』',
        '•' + keyword + '•',
        '_' + keyword + '_',
        'X' + keyword + 'X',
        keyword + '〆',
        keyword + 'メ',
        '꧁' + keyword + '꧂',
        '༺' + keyword + '༻',
        '𓆩' + keyword + '𓆪',
        '♛ ' + keyword + ' ♛'

      ];

    }

  }

  else{

    const icons = [
      '◆',
      '◇',
      '◈',
      '✦',
      '⬢',
      '★',
      '✧',
      '❖'
    ];

    out =
      icons.map((icon,i) =>
        icon +
        ' ' +
        keyword +
        (i % 2
          ? ' Studio'
          : ' ' + type)
      );

  }


  document
    .getElementById('results')
    .innerHTML =
      out.map(text => {

        const safe =
          text
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;')
            .replace(/'/g,'&#039;');

        return `

          <div class="name">

            <span>
              ${safe}
            </span>

            <button
              class="copy"
              onclick="copyText('${text.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"
            >
              کپی
            </button>

          </div>

        `;

      }).join('');

}
